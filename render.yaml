services:
  # Backend Spring Boot REST API
  - type: web
    name: codeb-mis-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ORIGINS
        value: '*'
      - key: DDL_AUTO
        value: update
      - key: DB_URL
        value: jdbc:h2:file:/app/data/codeb_mis;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: DB_DRIVER
        value: org.h2.Driver
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ''

  # Frontend React SPA
  - type: web
    name: codeb-mis-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
